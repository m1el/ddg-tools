name = "DdgProofs"
version = "0.1.0"
defaultTargets = ["DdgProofs"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

[[lean_lib]]
name = "DdgProofs"

# The oracle's scalar-generic formula definitions (namespace `Ddg`); `DdgProofs.Oracle` instantiates
# them at the real numbers and restates the theorems about them.
[[require]]
name = "ddgOracle"
path = "../oracle"

# The library `DDG` (Mathlib only): the reusable theory. `DdgProofs` is the application layer on top.
[[require]]
name = "ddg"
path = "../ddg"
