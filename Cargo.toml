[workspace]
resolver = "3"
members = ["crates/*"]
# Contract-only directories (SPEC.md, no crate yet); drop an entry when its Cargo.toml lands.
exclude = ["crates/ddg-flip-geodesics", "crates/ddg-integer-coords"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""
rust-version = "1.90"

[profile.release]
opt-level = 3
debug = "line-tables-only"

[profile.bench]
inherits = "release"
