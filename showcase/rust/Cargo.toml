[package]
name = "showcase-data"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Data for the showcase renders: raw optimal cones and intrinsic triangulations as JSON"

# Standalone: not a member of the repository's workspace.
[workspace]

[dependencies]
ddg-core = { path = "../../crates/ddg-core" }
ddg-optimal-cones = { path = "../../crates/ddg-optimal-cones" }
ddg-intrinsic = { path = "../../crates/ddg-intrinsic" }
ddg-intrinsic-apps = { path = "../../crates/ddg-intrinsic-apps" }
serde_json = "1"

[profile.release]
opt-level = 3
