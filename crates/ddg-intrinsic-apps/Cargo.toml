[package]
name = "ddg-intrinsic-apps"
description = "Applications of intrinsic triangulations (Sharp, Soliman, Crane 2019, Sec. 5): Steiner trees, finite elements, geodesic distance by the heat method"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ddg-core = { path = "../ddg-core" }
ddg-intrinsic = { path = "../ddg-intrinsic" }

[dev-dependencies]
# Benches of the heat method (benches/heat.rs); the same version as ddg-intrinsic and ddg-uv.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "heat"
harness = false
