[package]
name = "ddg-intrinsic"
description = "Intrinsic triangulations with the signpost data structure (Sharp, Soliman, Crane 2019): flips, Delaunay, refinement, correspondence with the input mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ddg-core = { path = "../ddg-core" }

[dev-dependencies]
# The consumer of the simplicial export: tests/export.rs runs the cut flow on an export and
# carries the cut back.
ddg-variational-cuts = { path = "../ddg-variational-cuts" }
# Benches of the retriangulations (benches/retriangulation.rs); the same version as ddg-uv.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "retriangulation"
harness = false
