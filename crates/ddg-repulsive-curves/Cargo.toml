[package]
name = "ddg-repulsive-curves"
description = "Repulsive Curves (Yu, Schumacher, Crane 2021): tangent-point energy, fractional Sobolev descent, constraints and hierarchical acceleration for curve networks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Dependencies are set by WP1 (SPEC.md §15); `[[bench]]` entries are added by WP14.
[dependencies]
ddg-core = { path = "../ddg-core" }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
rayon = "1.10"

# Benchmarks (WP14, SPEC.md §17k): plain mains that print CSV rows; run alone.
[[bench]]
name = "fig20"
harness = false

[[bench]]
name = "threads"
harness = false

[[bench]]
name = "components"
harness = false

[[bench]]
name = "projdiag"
harness = false

[[bench]]
name = "trialrule"
harness = false

[[bench]]
name = "nearpair"
harness = false
