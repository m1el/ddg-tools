[package]
name = "ddg-py"
description = "Python module `ddg_tools`: mesh buffers in, per-corner UVs out (PyO3 binding of the ddg-tools workspace)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
# `cdylib` is the Python extension module (built by maturin with `--features python`);
# `rlib` lets `cargo test` and other crates use the pure-Rust part.
crate-type = ["cdylib", "rlib"]

[features]
# Nothing by default: a plain `cargo build` / `cargo test` (also at the workspace root) compiles
# only the pure-Rust part of this crate and needs neither PyO3 nor a Python interpreter.
default = []
# The PyO3 glue (`src/python.rs`). maturin enables it through `pyproject.toml`.
python = ["dep:pyo3"]

[dependencies]
ddg-core = { path = "../ddg-core" }
# The real pipeline: polygons -> seams -> cones -> cut -> flatten -> per-corner UVs. The triangulation
# comes from Blender itself (`mesh.loop_triangles`).
ddg-uv = { path = "../ddg-uv" }
# The cone solver: `reoptimize_cones` (optimal angles for given cone positions).
ddg-optimal-cones = { path = "../ddg-optimal-cones" }
# The cut flow: the types of its controls (energy, step size, stages, stop rule).
ddg-variational-cuts = { path = "../ddg-variational-cuts" }
# Boundary First Flattening: `map_to_sphere` (a closed genus-0 mesh to the unit sphere).
ddg-bff = { path = "../ddg-bff" }
# Applications of intrinsic triangulations: geodesic_distance and steiner_tree (src/intrinsic_apps.rs),
# tangent fields and adaptive refinement (src/intrinsic_vector.rs).
ddg-intrinsic = { path = "../ddg-intrinsic" }
ddg-intrinsic-apps = { path = "../ddg-intrinsic-apps" }
# The integer representation (Gillespie, Sharp, Crane 2021): the `representation=` option and src/integer_coords.rs.
ddg-integer-coords = { path = "../ddg-integer-coords" }
# Geodesic paths, loops, networks and Bézier curves by edge flips (Sharp, Crane 2020): src/flip_geodesics.rs.
ddg-flip-geodesics = { path = "../ddg-flip-geodesics" }
# Developability of triangle meshes (Stein, Grinspun, Crane 2018): energy, flow, cut and flatten
# (src/developability.rs).
ddg-developability = { path = "../ddg-developability" }
# Repulsive Curves (Yu, Schumacher, Crane 2021): tangent-point energy, fractional Sobolev flow,
# constraints and penalties for curve networks (src/repulsive.rs).
ddg-repulsive-curves = { path = "../ddg-repulsive-curves" }
# Surface simplification using intrinsic error metrics (Liu et al. 2023): simplify, hierarchy and multigrid,
# applications, QEM (src/simplification.rs).
ddg-intrinsic-simplification = { path = "../ddg-intrinsic-simplification" }
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
