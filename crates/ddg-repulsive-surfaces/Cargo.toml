[package]
name = "ddg-repulsive-surfaces"
description = "Repulsive Surfaces (Yu, Brakensiek, Schumacher, Crane 2021): tangent-point energy of triangle meshes, fractional Sobolev descent, constraints, penalties, Barnes-Hut, hierarchical matrices and remeshing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Dependencies are set by WP1 (SPEC.md §15); `[[bench]]` entries are added by WP17.
[dependencies]
ddg-core = { path = "../ddg-core" }
ddg-repulsive-curves = { path = "../ddg-repulsive-curves" }
faer = { version = "0.24.4", default-features = false, features = ["std", "rayon", "sparse-linalg"] }
rayon = "1.10"
# GPU back end (`NOTES-GPU.md`): the CUDA driver and NVRTC are opened at run time (`dynamic-loading`),
# so building with `--features cuda` needs no CUDA installation; running needs a driver and libnvrtc 12.
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"] }

[features]
# The CUDA back end of the hierarchical products (off by default; the CPU path is the reference).
cuda = ["dep:cudarc"]

[[bench]]
name = "ccd"
harness = false

[[bench]]
name = "step"
harness = false

[[bench]]
name = "product"
harness = false
