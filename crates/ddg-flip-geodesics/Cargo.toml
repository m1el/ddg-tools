[package]
name = "ddg-flip-geodesics"
description = "Geodesic paths, loops and networks by edge flips (Sharp, Crane 2020, FlipOut), generic over the intrinsic triangulation representation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ddg-core = { path = "../ddg-core" }
ddg-intrinsic = { path = "../ddg-intrinsic" }
# Extraction runs per edge in parallel (F24).
rayon = "1.10"

[dev-dependencies]
# Ground truth for minimality (SPEC §7 test 4, F23).
ddg-intrinsic-apps = { path = "../ddg-intrinsic-apps" }
# The integer representation, for the differential test (SPEC §7 layer 2, test 8).
ddg-integer-coords = { path = "../ddg-integer-coords" }
