[package]
name = "ddg-uv"
description = "End-to-end UV unwrapping: polygon mesh in, one UV per polygon corner out (optimal cones + boundary first flattening + packing)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Without default features: the default feature of ddg-core compiles GPL-derived triangulation
# code (Blender's tessellation), which this MIT crate must not link. The triangulation of the
# caller's polygons is an input of the pipeline.
ddg-core = { path = "../ddg-core", default-features = false }
ddg-bff = { path = "../ddg-bff" }
ddg-optimal-cones = { path = "../ddg-optimal-cones" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
