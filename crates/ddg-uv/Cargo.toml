[package]
name = "ddg-uv"
description = "End-to-end UV unwrapping: polygon mesh in, one UV per polygon corner out (optimal cones + boundary first flattening + packing)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The triangulation of the caller's polygons is an input of the pipeline; ddg-core has no triangulator.
ddg-core = { path = "../ddg-core" }
ddg-bff = { path = "../ddg-bff" }
ddg-optimal-cones = { path = "../ddg-optimal-cones" }
# The cut flow (Sharp, Crane 2018): src/cutting wraps it for polygon meshes.
ddg-variational-cuts = { path = "../ddg-variational-cuts" }
# The intrinsic triangulation the cut flow can run on (src/cutting/intrinsic.rs).
ddg-intrinsic = { path = "../ddg-intrinsic" }
# Its integer-coordinates representation (Gillespie, Sharp, Crane 2021), the default
# (IntrinsicOptions::representation), and the consumers' representation switch.
ddg-integer-coords = { path = "../ddg-integer-coords" }
ddg-intrinsic-apps = { path = "../ddg-intrinsic-apps" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "cutting"
harness = false
